<style>
:root{--tp:#1c1917;--ts:#57534e;--bg:#fafaf9;--bg2:#f5f5f4;--bg3:#e7e5e4;--bd:#d6d3d1;--ac:#c2410c;--card:#fff;--sb:#fff;--hdr:rgba(250,250,249,0.9);--qb:#fffbeb;--eb:#ecfdf5;--cb:#fffbeb;--xb:#eff6ff;--xbn:#93c5fd;--xlc:#1d4ed8;--tb:#f5f5f4;--th:#fafaf9}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tp);transition:background .3s,color .3s}
.fr{font-family:'Crimson Pro',Georgia,serif}
.ct p{font-family:'Crimson Pro',serif;font-size:1.15rem;line-height:1.85;margin:0 0 1rem;color:var(--tp)}
.ct h2{font-family:'Crimson Pro',serif;font-size:1.7rem;font-weight:700;line-height:1.3;margin:2.5rem 0 .75rem;color:var(--tp)}
.ct ul{font-family:'Crimson Pro',serif;font-size:1.15rem;line-height:1.85;margin:0 0 1rem;padding-left:1.5rem;color:var(--tp)}
.ct li{margin-bottom:.3rem}.ct li::marker{color:var(--ac)}
.ct blockquote{border-left:4px solid var(--ac);padding:.8rem 1.2rem;margin:1.2rem 0;background:var(--qb);border-radius:0 8px 8px 0}
.ct blockquote p{margin:0;font-style:italic}
.ct table{width:100%;border-collapse:collapse;margin:1.2rem 0;font-family:'DM Sans',sans-serif;font-size:.88rem}
.ct thead{background:var(--tb)}.ct th{padding:.6rem .8rem;text-align:left;font-weight:600;border-bottom:2px solid var(--bd);color:var(--tp)}
.ct td{padding:.55rem .8rem;border-bottom:1px solid var(--bd);color:var(--tp)}.ct tbody tr:hover{background:var(--th)}
.ct .fm{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:1.2rem 1.5rem;margin:1.2rem 0;text-align:center;font-family:'Crimson Pro',serif;font-size:1.3rem;font-weight:600;color:var(--tp)}
.ct .tk{background:var(--qb);border-left:4px solid var(--ac);border-radius:0 10px 10px 0;padding:1rem 1.2rem;margin:1.2rem 0}
.ct .tk .lb{font-family:'DM Sans',sans-serif;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ac);margin-bottom:.4rem}
.ct .tk p{margin:0}
.ct .fl{text-align:center;padding:.5rem 0;margin:.5rem 0;font-family:'Crimson Pro',serif;font-size:1.1rem;color:var(--ts);line-height:1.8}
.ct .fl .ar{color:var(--ac)}
.ct .st{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:1rem 1.2rem;margin:.8rem 0}
.ct .st .sn{font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:700;color:var(--ac);margin-bottom:.3rem}
.ct .st div:last-child{font-family:'Crimson Pro',serif;font-size:1.1rem;line-height:1.8;color:var(--tp)}
.ct .xz{background:var(--xb);border:2px solid var(--xbn);border-radius:10px;padding:1.2rem;margin:1.2rem 0}
.ct .xz .lb{font-family:'DM Sans',sans-serif;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--xlc);margin-bottom:.4rem}
.ct strong{font-weight:700;color:var(--tp)}
.hdr{height:56px;background:var(--hdr);border-bottom:1px solid var(--bd);backdrop-filter:blur(12px);position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;padding:0 12px;gap:8px}
.sb{width:280px;background:var(--sb);border-right:1px solid var(--bd);height:calc(100vh - 56px);position:fixed;top:56px;left:0;overflow-y:auto;z-index:35;transition:transform .3s}
.tp{width:220px;background:var(--bg);border-left:1px solid var(--bd);height:calc(100vh - 56px);position:fixed;top:56px;right:0;overflow-y:auto;z-index:30;transition:transform .3s}
.mc{margin-left:280px;margin-right:220px;padding-top:56px;min-height:100vh;transition:margin .3s}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:34;display:none}.ov.on{display:block}
.fnav{position:fixed;bottom:0;left:280px;right:220px;z-index:40;padding:8px 16px;background:var(--hdr);border-top:1px solid var(--bd);backdrop-filter:blur(12px);transition:left .3s,right .3s}
.bk-t{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ts);padding:.6rem .8rem .25rem}
.ch-i{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;cursor:pointer;transition:background .12s;font-size:.8rem;color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-i:hover{background:var(--bg3);color:var(--tp)}.ch-i.on{background:var(--bg3);color:var(--ac);font-weight:600}
.ch-i.dn{color:#059669}.ch-i.dn::before{content:"\2713";font-size:.65rem;font-weight:900;flex-shrink:0}
.tl{display:block;padding:4px 12px;font-size:.8rem;color:var(--ts);cursor:pointer;border-left:2px solid transparent}
.tl:hover{color:var(--tp)}.tl.on{color:var(--ac);border-left-color:var(--ac);font-weight:600}
.pb{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}.pf{height:100%;background:var(--ac);border-radius:2px;transition:width .4s}
.smo{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding-top:8vh}
.smo.on{display:flex}
.sbx{background:var(--card);border:1px solid var(--bd);border-radius:14px;width:92%;max-width:560px;max-height:70vh;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.sin{width:100%;padding:14px 14px 14px 40px;border:none;background:transparent;font-size:1rem;color:var(--tp);outline:none;font-family:'DM Sans',sans-serif}
.sri{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bd);transition:background .12s}.sri:hover{background:var(--bg3)}
.sri .st{font-weight:600;font-size:.85rem;color:var(--tp)}.sri .sc{font-size:.78rem;color:var(--ts);margin-top:2px}
.tst{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);padding:10px 20px;border-radius:10px;font-size:.85rem;font-weight:500;z-index:300;transition:transform .3s;box-shadow:0 8px 30px rgba(0,0,0,.15);white-space:nowrap}
.tst.sh{transform:translateX(-50%) translateY(0)}.tst.ok{background:#059669;color:#fff}.tst.inf{background:var(--ac);color:#fff}
.qo{display:block;width:100%;text-align:left;padding:10px 14px;border:2px solid var(--bd);border-radius:8px;cursor:pointer;transition:all .12s;background:var(--card);color:var(--tp);font-size:.88rem;margin-bottom:6px;font-family:'DM Sans',sans-serif}
.qo:hover{border-color:var(--ac)}.qo.ok{border-color:#059669;background:var(--eb)}.qo.no{border-color:#dc2626;background:#fef2f2}.qo[disabled]{cursor:default;opacity:.85}
.hg{background:linear-gradient(135deg,#431407 0%,#78350f 30%,#b45309 60%,#f59e0b 100%)}
.cb{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0}
.ch2{transition:transform .2s,box-shadow .2s}.ch2:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.1)}
.dark .ch2:hover{box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bmk.on{color:#d97706;transform:scale(1.15)}.bmk{transition:all .2s}
@media(max-width:1024px){.sb{transform:translateX(-100%)}.sb.on{transform:translateX(0)}.tp{transform:translateX(100%)}.tp.on{transform:translateX(0)}.mc{margin-left:0!important;margin-right:0!important}.fnav{left:0;right:0}.dsk{display:none!important}}
@media(min-width:1025px){.mob{display:none!important}}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.fi{animation:fi .35s ease forwards}
@keyframes su{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}.su{animation:su .5s ease forwards}
.d1{animation-delay:.1s;opacity:0}.d2{animation-delay:.2s;opacity:0}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
</style>
</head>

<div class="fnav" id="FNAV" style="display:none"><div style="max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px"><button id="FPRV" style="display:none;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:.82rem;font-weight:500;background:var(--bg3);color:var(--tp);border:none;cursor:pointer"><i class="fas fa-arrow-left" style="font-size:.7rem"></i><span class="dsk"></span></button><button id="FDN" style="display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;font-size:.82rem;font-weight:700;background:var(--ac);color:#fff;border:none;cursor:pointer"><i class="fas fa-circle" style="font-size:.6rem"></i><span class="dsk">Tandai Selesai</span></button><button id="FNXT" style="display:none;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:.82rem;font-weight:500;background:var(--bg3);color:var(--tp);border:none;cursor:pointer"><span class="dsk"></span><i class="fas fa-arrow-right" style="font-size:.7rem"></i></button></div></div>
<div class="tst" id="TST"></div>
<div class="smo" id="SMO"><div class="sbx"><div style="position:relative"><i class="fas fa-search" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ts);font-size:.85rem"></i><input class="sin" id="SIN" placeholder="Cari materi..."><kbd style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:.7rem;padding:2px 6px;border-radius:4px;background:var(--bg3);color:var(--ts);font-family:inherit">ESC</kbd></div><div id="SRS" style="max-height:50vh;overflow-y:auto"></div></div></div>

<script>
/* ================================================================
   DATA — disimpan terpisah, string sederhana, tanpa karakter aneh
   ================================================================ */
var BOOKS = [
  {
    id:'buku-1', n:1, title:'Fondasi Resource & Capital Allocation',
    obj:'Setelah menyelesaikan Buku I, pelajar diharapkan mampu:\n\n1. memahami apa sebenarnya capital;\n2. membedakan capital dengan cash;\n3. menghitung opportunity cost;\n4. menemukan bottleneck bisnis;\n5. memahami supply chain;\n6. memahami economies of scale;\n7. memahami ROIC;\n8. membedakan revenue dengan value creation;\n9. memahami strategic return;\n10. mulai berpikir seperti capital allocator.',
    chapters:[
      {id:'bab-1',num:1,title:'MEMAHAMI CAPITAL',secs:[
        {id:'s1-1',title:'1.1 Apa itu Capital?',html:'<p>Capital secara sederhana adalah sumber daya yang digunakan untuk menghasilkan output ekonomi.</p><p>Banyak orang menganggap:</p><blockquote><p>Capital = uang.</p></blockquote><p>Ini terlalu sempit.</p><p>Dalam bisnis, capital dapat berupa:</p><ul><li>cash;</li><li>mesin;</li><li>tanah;</li><li>gedung;</li><li>pabrik;</li><li>teknologi;</li><li>patent;</li><li>software;</li><li>data;</li><li>tenaga manusia;</li><li>jaringan supplier;</li><li>distribution network;</li><li>brand;</li><li>intellectual property;</li><li>hubungan bisnis;</li><li>waktu manajemen.</li></ul><h2>Contoh</h2><p>Perusahaan A mempunyai:</p><ul><li>Rp10 miliar cash;</li><li>50 engineer;</li><li>software proprietary;</li><li>100 supplier;</li><li>20 distributor;</li><li>100.000 pelanggan.</li></ul><p>Perusahaan B mempunyai:</p><ul><li>Rp20 miliar cash;</li><li>tetapi tidak memiliki teknologi;</li><li>tidak memiliki supplier;</li><li>tidak memiliki pelanggan.</li></ul><p>Tidak berarti perusahaan B otomatis dua kali lebih kuat.</p><p>Mengapa?</p><p>Karena capital harus dinilai berdasarkan:</p><blockquote><p>kemampuan menghasilkan output ekonomi.</p></blockquote>'},
        {id:'s1-2',title:'1.2 Financial Capital',html:'<p>Financial capital adalah sumber daya finansial.</p><h2>Contoh:</h2><ul><li>cash;</li><li>equity;</li><li>debt;</li><li>retained earnings;</li><li>investment capital.</li></ul><p>Financial capital digunakan untuk membiayai:</p><ul><li>inventory;</li><li>factory;</li><li>R&amp;D;</li><li>marketing;</li><li>acquisition;</li><li>employee;</li><li>technology.</li></ul>'},
        {id:'s1-3',title:'1.3 Human Capital',html:'<p>Human capital adalah kemampuan manusia yang menghasilkan economic value.</p><h2>Contoh:</h2><p>Seorang engineer dapat menciptakan:</p><ul><li>software;</li><li>automation;</li><li>AI model;</li><li>manufacturing process;</li><li>paten.</li></ul>'}
      ]}
    ]
  },
  {
    id:'buku-3', n:3, title:'Industrial China & Strategic Capital', obj:'',
    chapters:[
      {id:'bab-21',num:21,title:'PORTFOLIO OF BUSINESSES',secs:[
        {id:'s21-1',title:'21.1 Apa itu Portfolio of Businesses?',html:'<p>Jika seorang entrepreneur hanya memiliki satu bisnis, pertanyaan utamanya:</p><blockquote><p>Ke mana modal bisnis ini harus dialokasikan?</p></blockquote><p>Tetapi jika sebuah grup memiliki 5, 10, atau 50 bisnis, masalahnya berubah menjadi:</p><blockquote><p>Bagaimana seluruh capital grup dialokasikan di antara berbagai bisnis?</p></blockquote><h2>Contoh:</h2><table><thead><tr><th>Bisnis</th><th>Capital</th><th>ROIC</th><th>Growth</th></tr></thead><tbody><tr><td>A</td><td>Rp20 M</td><td>5%</td><td>2%</td></tr><tr><td>B</td><td>Rp10 M</td><td>30%</td><td>20%</td></tr><tr><td>C</td><td>Rp15 M</td><td>18%</td><td>10%</td></tr><tr><td>D</td><td>Rp5 M</td><td>-5%</td><td>-10%</td></tr></tbody></table><p>Kesalahan besar adalah memberikan:</p><p>Rp12,5 M kepada setiap bisnis.</p><p>Mengapa?</p><p>Karena kualitas peluangnya berbeda.</p>'},
        {id:'s21-2',title:'21.2 Capital Tidak Harus Dibagi Rata',html:'<p>Capital allocator bertanya:</p><p><strong>Bisnis A</strong></p><p>Apakah masih mempunyai peluang turnaround?</p><p><strong>Bisnis B</strong></p><p>Apakah dapat menyerap lebih banyak capital?</p><p><strong>Bisnis C</strong></p><p>Apakah sudah mature?</p><p><strong>Bisnis D</strong></p><p>Apakah harus dihentikan?</p><p>Jadi capital allocation dapat berbentuk:</p><ul><li>B naik</li><li>C tetap</li><li>A turun</li><li>D - Exit</li></ul>'},
        {id:'s21-3',title:'21.3 Empat Kategori Bisnis',html:'<h2>1. Compounder</h2><p>ROIC tinggi + growth tinggi.</p><p>Beri capital.</p><h2>2. Cash Generator</h2><p>ROIC tinggi + growth rendah.</p><p>Ambil cash flow untuk membiayai peluang lain.</p><h2>3. Turnaround</h2><p>ROIC rendah tetapi dapat diperbaiki.</p><p>Investasi terbatas + eksperimen.</p><h2>4. Destroyer</h2><p>ROIC rendah + prospek buruk.</p><p>Kurangi atau keluar.</p>'},
        {id:'s21-4',title:'21.4 Pertanyaan Portfolio',html:'<p>Untuk setiap bisnis:</p><ul><li>Berapa ROIC?</li><li>Berapa growth?</li><li>Berapa capital yang dibutuhkan?</li><li>Berapa lama opportunity bertahan?</li><li>Apakah ada moat?</li><li>Apakah ada strategic value?</li><li>Apakah bisnis dapat menyerap tambahan capital?</li><li>Apa opportunity cost-nya?</li></ul>'}
      ]},
      {id:'bab-22',num:22,title:'CAPITAL ALLOCATION ANTAR-BISNIS',secs:[
        {id:'s22-1',title:'22.1 Masalah Utama',html:'<p>Misalnya grup memiliki:</p><p>Rp100 M.</p><p>Terdapat:</p><p><strong>Business A</strong></p><p>ROIC = 8%.</p><p><strong>Business B</strong></p><p>ROIC = 25%.</p><p><strong>Business C</strong></p><p>ROIC = 18%.</p><p><strong>Business D</strong></p><p>ROIC = 5%.</p><p>Jangan langsung:</p><p>B mendapatkan 100%.</p><p>Karena ada pertanyaan lain:</p><p>Berapa banyak capital yang dapat B serap dengan return yang tetap menarik?</p>'},
        {id:'s22-2',title:'22.2 Reinvestment Capacity',html:'<p>Sebuah bisnis dapat mempunyai ROIC tinggi tetapi market opportunity kecil.</p><h2>Contoh:</h2><p>ROIC = 50%.</p><p>Tetapi hanya membutuhkan:</p><p>Rp1 M tambahan.</p><p>Sementara bisnis lain:</p><p>ROIC = 25%.</p><p>Tetapi mempunyai opportunity untuk menyerap:</p><p>Rp50 M.</p><p>Maka bisnis kedua mungkin memberikan dampak ekonomi lebih besar kepada grup.</p>'},
        {id:'s22-3',title:'22.3 Capital Allocation Hierarchy',html:'<p>Gunakan urutan:</p><h2>1. Survival</h2><p>Pastikan bisnis tidak kekurangan liquidity.</p><h2>2. High-return reinvestment</h2><p>Investasikan pada proyek internal dengan economics kuat.</p><h2>3. Strategic investment</h2><p>Bangun capability penting.</p><h2>4. Acquisition</h2><p>Jika acquisition memberikan value yang masuk akal.</p><h2>5. Debt reduction</h2><p>Jika leverage terlalu tinggi.</p><h2>6. Return capital</h2><p>Jika tidak ada opportunity menarik.</p>'},
        {id:'s22-4',title:'22.4 Internal Capital Market',html:'<p>Sebuah grup perusahaan dapat bertindak seperti:</p><blockquote><p>internal capital market.</p></blockquote><p>Bisnis yang menghasilkan cash dapat membiayai bisnis lain.</p><h2>Contoh:</h2><p><strong>Business A:</strong></p><p>Cash flow = Rp20 M.</p><p><strong>Business B:</strong></p><p>Membutuhkan Rp15 M untuk ekspansi.</p><p>Grup dapat memindahkan capital A ke B.</p><p>Ini memungkinkan:</p><p>capital bergerak di dalam ecosystem perusahaan.</p>'}
      ]},
      {id:'bab-23',num:23,title:'GOVERNMENT + INDUSTRY + CAPITAL',secs:[
        {id:'s23-1',title:'23.1 Mengapa Ini Penting untuk Memahami China?',html:'<p>Untuk menganalisis bisnis di China, jangan hanya melihat:</p><p>perusahaan.</p><p>Lihat tiga lapisan:</p><div class="fl">Policy<br><span class="ar">↓</span><br>Industry<br><span class="ar">↓</span><br>Company</div>'},
        {id:'s23-2',title:'23.2 Policy',html:'<p>Kebijakan dapat memengaruhi:</p><ul><li>infrastructure;</li><li>financing;</li><li>technology;</li><li>energy;</li><li>manufacturing;</li><li>trade;</li><li>strategic industries.</li></ul>'},
        {id:'s23-3',title:'23.3 Industry',html:'<p>Setelah memahami kebijakan, lihat:</p><ul><li>market size;</li><li>competitors;</li><li>supply chain;</li><li>margins;</li><li>capital intensity;</li><li>barriers to entry;</li><li>demand.</li></ul>'},
        {id:'s23-4',title:'23.4 Company',html:'<p>Baru kemudian analisis:</p><ul><li>revenue;</li><li>profit;</li><li>ROIC;</li><li>debt;</li><li>cash flow;</li><li>management;</li><li>competitive advantage.</li></ul>'},
        {id:'s23-5',title:'23.5 Tiga-Lapis Analysis',html:'<p>Gunakan:</p><p><strong>Layer 1</strong></p><p>Macro</p><p>Apa yang terjadi dalam ekonomi?</p><p><strong>Layer 2</strong></p><p>Industry</p><p>Industri mana yang berkembang?</p><p><strong>Layer 3</strong></p><p>Company</p><p>Perusahaan mana yang paling mampu menangkap value?</p>'},
        {id:'s23-6',title:'23.6 Contoh',html:'<p>Misalnya teknologi battery berkembang.</p><p>Jangan langsung membeli perusahaan battery.</p><p>Analisis:</p><div class="fl">Policy<br><span class="ar">↓</span><br>Apakah sektor didukung?<br><br>Industry<br><span class="ar">↓</span><br>Siapa supplier?<br><br>Technology<br><span class="ar">↓</span><br>Siapa mempunyai technology advantage?<br><br>Manufacturing<br><span class="ar">↓</span><br>Siapa paling efisien?<br><br>Company<br><span class="ar">↓</span><br>Siapa mempunyai ROIC dan moat terbaik?</div>'}
      ]},
      {id:'bab-24',num:24,title:'CHINA VS INDONESIA',secs:[
        {id:'s24-1',title:'24.1 Jangan Copy-Paste',html:'<p>Salah satu kesalahan ketika mempelajari China adalah:</p><blockquote><p>China melakukan X, berarti Indonesia harus melakukan X.</p></blockquote><p>Tidak selalu.</p><p>China dan Indonesia berbeda dalam:</p><ul><li>ukuran ekonomi;</li><li>struktur industri;</li><li>demografi;</li><li>sistem keuangan;</li><li>regulasi;</li><li>infrastruktur;</li><li>supply chain;</li><li>struktur perusahaan;</li><li>kebijakan pemerintah.</li></ul>'},
        {id:'s24-2',title:'24.2 Yang Bisa Dipelajari',html:'<p>Ambil prinsip:</p><h2>1. Supply chain thinking</h2><p>Jangan hanya melihat produk.</p><h2>2. Industrial clustering</h2><p>Perusahaan yang saling berdekatan dapat berbagi:</p><ul><li>supplier;</li><li>tenaga kerja;</li><li>logistics;</li><li>knowledge.</li></ul><h2>3. Scale</h2><p>Cari economics yang membaik ketika volume meningkat.</p><h2>4. Manufacturing efficiency</h2><p>Kurangi waste dan meningkatkan produktivitas.</p><h2>5. Long-term capability</h2><p>Bangun kemampuan yang sulit ditiru.</p><h2>6. Infrastructure</h2><p>Perhatikan bahwa infrastruktur dapat mengubah economics seluruh industri.</p>'},
        {id:'s24-3',title:'24.3 Contoh Adaptasi Indonesia',html:'<p>Misalnya kamu membangun bisnis:</p><p>AI data center.</p><p>Jangan hanya berpikir:</p><blockquote><p>Saya menjual compute.</p></blockquote><p>Analisis:</p><ul><li>electricity;</li><li>land;</li><li>cooling;</li><li>fiber;</li><li>server;</li><li>chips;</li><li>financing;</li><li>customers;</li><li>maintenance.</li></ul><p>Inilah:</p><p><strong>industrial thinking.</strong></p>'}
      ]},
      {id:'bab-25',num:25,title:'MIXED OWNERSHIP',secs:[
        {id:'s25-1',title:'25.1 Konsep',html:'<p>Mixed ownership berarti suatu struktur kepemilikan yang menggabungkan berbagai sumber capital.</p><p>Dalam konteks materi China, konsep ini berkaitan dengan upaya menggabungkan berbagai bentuk capital dan memperbaiki governance serta efisiensi.</p><p>Secara bisnis:</p><div class="fl">Capital A<br><span class="ar">↕</span><br>Technology B<br><span class="ar">↕</span><br>Distribution C<br><span class="ar">↕</span><br>Manufacturing D</div><p>dapat membentuk satu sistem.</p>'},
        {id:'s25-2',title:'25.2 Mengapa Tidak Harus Membangun Semuanya Sendiri?',html:'<p>Misalnya perusahaan kamu membutuhkan:</p><p><strong>Technology:</strong> Rp20 M.</p><p><strong>Distribution:</strong> Rp10 M.</p><p><strong>Factory:</strong> Rp50 M.</p><p>Jika membangun semuanya sendiri:</p><p>kebutuhan capital = Rp80 M.</p><p>Alternatif:</p><ul><li>Technology partner.</li><li>Distribution partner.</li><li>Contract manufacturer.</li></ul><p>Capital yang diperlukan mungkin lebih kecil.</p>'},
        {id:'s25-3',title:'25.3 Bentuk Kerja Sama',html:'<table><thead><tr><th>Bentuk</th><th>Deskripsi</th></tr></thead><tbody><tr><td>Partnership</td><td>Dua pihak bekerja sama.</td></tr><tr><td>Joint Venture</td><td>Membentuk entitas bersama.</td></tr><tr><td>Licensing</td><td>Menggunakan teknologi pihak lain.</td></tr><tr><td>Strategic Investment</td><td>Membeli sebagian kepemilikan.</td></tr><tr><td>Acquisition</td><td>Membeli perusahaan.</td></tr><tr><td>Outsourcing</td><td>Menggunakan kemampuan eksternal.</td></tr></tbody></table>'},
        {id:'s25-4',title:'25.4 Pertanyaan Utama',html:'<p>Jangan bertanya:</p><blockquote><p>Haruskah saya memiliki semuanya?</p></blockquote><p>Tanyakan:</p><blockquote><p>Capability mana yang merupakan core moat dan harus saya kuasai?</p></blockquote>'}
      ]},
      {id:'bab-26',num:26,title:'LEVERAGE',secs:[
        {id:'s26-1',title:'26.1 Apa itu Leverage?',html:'<p>Leverage berarti menggunakan resource tertentu untuk memperbesar output.</p><p>Bentuknya bukan hanya debt.</p>'},
        {id:'s26-2',title:'26.2 Financial Leverage',html:'<p>Contoh:</p><p>Modal sendiri: Rp10 M.</p><p>Debt: Rp10 M.</p><p>Total capital: Rp20 M.</p><p>Jika investasi berhasil, return kepada equity bisa meningkat.</p><p>Tetapi jika investasi gagal:</p><p>kerugian equity juga dapat meningkat.</p><p>Karena itu debt mempunyai:</p><p><strong>amplification effect.</strong></p>'},
        {id:'s26-3',title:'26.3 Human Leverage',html:'<p>Satu entrepreneur tidak mungkin melakukan:</p><ul><li>sales;</li><li>accounting;</li><li>manufacturing;</li><li>R&amp;D;</li><li>marketing;</li><li>logistics</li></ul><p>sendirian.</p><p>Team menjadi leverage.</p>'},
        {id:'s26-4',title:'26.4 Technology Leverage',html:'<p>Software dapat melakukan pekerjaan yang sebelumnya membutuhkan banyak manusia.</p><h2>Contoh:</h2><p>Sistem otomatis dapat:</p><ul><li>memproses order;</li><li>membuat laporan;</li><li>melakukan forecasting;</li><li>mengontrol inventory.</li></ul>'},
        {id:'s26-5',title:'26.5 Distribution Leverage',html:'<p>Jika perusahaan mempunyai network:</p><p>1 distributor dapat membawa produk ke:</p><p>10.000 pelanggan.</p><p>Maka network tersebut menjadi leverage.</p>'},
        {id:'s26-6',title:'26.6 Partnership Leverage',html:'<p>Partner dapat memberikan:</p><ul><li>capital;</li><li>market access;</li><li>technology;</li><li>manufacturing;</li><li>regulatory knowledge.</li></ul>'},
        {id:'s26-7',title:'26.7 Leverage dan Risk',html:'<p>Semakin besar leverage:</p><p>semakin besar potensi output,</p><p>tetapi juga:</p><p>semakin besar konsekuensi jika asumsi salah.</p><p>Karena itu:</p><div class="tk"><div class="lb">Takeaway</div><p>Leverage harus disesuaikan dengan certainty dan cash flow.</p></div>'}
      ]},
      {id:'bab-27',num:27,title:'ASSET-LIGHT VS ASSET-HEAVY',secs:[
        {id:'s27-1',title:'27.1 Asset-Heavy',html:'<p>Perusahaan memiliki:</p><ul><li>factory;</li><li>machines;</li><li>warehouses;</li><li>infrastructure.</li></ul><p><strong>Keuntungan:</strong></p><ul><li>kontrol tinggi;</li><li>capacity;</li><li>potential cost advantage;</li><li>strategic asset.</li></ul><p><strong>Kerugian:</strong></p><ul><li>capital besar;</li><li>depreciation;</li><li>maintenance;</li><li>utilization risk.</li></ul>'},
        {id:'s27-2',title:'27.2 Asset-Light',html:'<p>Menggunakan:</p><ul><li>outsourcing;</li><li>contract manufacturing;</li><li>cloud;</li><li>rented infrastructure.</li></ul><p><strong>Keuntungan:</strong></p><ul><li>capital lebih kecil;</li><li>fleksibilitas;</li><li>scaling lebih cepat.</li></ul><p><strong>Kerugian:</strong></p><ul><li>kontrol lebih rendah;</li><li>supplier dependency;</li><li>kemungkinan margin lebih rendah.</li></ul>'},
        {id:'s27-3',title:'27.3 Mana yang Lebih Baik?',html:'<p>Tidak ada jawaban universal.</p><p>Gunakan:</p><div class="fm">Risk-adjusted ROIC</div>'},
        {id:'s27-4',title:'27.4 Contoh',html:'<p><strong>Model A</strong></p><p>Invested capital: Rp100 M.</p><p>NOPAT: Rp20 M.</p><p>ROIC: 20%.</p><p><strong>Model B</strong></p><p>Invested capital: Rp20 M.</p><p>NOPAT: Rp5 M.</p><p>ROIC: 25%.</p><p>Model B lebih capital-efficient.</p><p>Tetapi jika Model A mempunyai:</p><ul><li>strategic control;</li><li>supply security;</li><li>proprietary manufacturing;</li></ul><p>maka A masih dapat memiliki strategic value.</p>'}
      ]},
      {id:'bab-28',num:28,title:'CAPITAL + TECHNOLOGY',secs:[
        {id:'s28-1',title:'28.1 Mengapa Teknologi Membutuhkan Capital?',html:'<p>Teknologi membutuhkan:</p><ul><li>research;</li><li>engineers;</li><li>compute;</li><li>equipment;</li><li>testing;</li><li>commercialization.</li></ul><p>Tetapi capital tanpa technology juga dapat menghasilkan:</p><p><strong>commodity business.</strong></p>'},
        {id:'s28-2',title:'28.2 Technology Flywheel',html:'<div class="fl">Capital<br><span class="ar">↓</span><br>R&amp;D<br><span class="ar">↓</span><br>Technology<br><span class="ar">↓</span><br>Product<br><span class="ar">↓</span><br>Market<br><span class="ar">↓</span><br>Revenue<br><span class="ar">↓</span><br>Cash Flow<br><span class="ar">↓</span><br>More R&amp;D</div>'},
        {id:'s28-3',title:'28.3 R&D vs Commercialization',html:'<p>R&amp;D menghasilkan:</p><p>capability.</p><p>Commercialization menghasilkan:</p><p>cash flow.</p><p>Perusahaan membutuhkan keduanya.</p><p>Jika hanya R&amp;D:</p><p>technology bagus tetapi tidak menghasilkan uang.</p><p>Jika hanya commercialization:</p><p>mungkin menghasilkan uang sekarang tetapi technology tertinggal.</p>'},
        {id:'s28-4',title:'28.4 Capital Allocation untuk R&D',html:'<p>Jangan hanya bertanya:</p><blockquote><p>Berapa persen revenue untuk R&amp;D?</p></blockquote><p>Tanyakan:</p><ul><li>proyek mana?</li><li>probability of success?</li><li>strategic value?</li><li>time to market?</li><li>intellectual property?</li><li>potential market?</li><li>capital required?</li></ul>'}
      ]},
      {id:'bab-29',num:29,title:'INDUSTRIAL FLYWHEEL',secs:[
        {id:'s29-1',title:'29.1 Model',html:'<div class="fl">R&amp;D<br><span class="ar">↓</span><br>Technology<br><span class="ar">↓</span><br>Manufacturing<br><span class="ar">↓</span><br>Scale<br><span class="ar">↓</span><br>Cost Reduction<br><span class="ar">↓</span><br>Market Share<br><span class="ar">↓</span><br>Cash Flow<br><span class="ar">↓</span><br>More R&amp;D<br><span class="ar">↓</span><br>Better Technology</div>'},
        {id:'s29-2',title:'29.2 Mengapa Ini Powerful?',html:'<p>Setiap putaran dapat memperkuat putaran berikutnya.</p><p>Misalnya:</p><div class="fl">Technology semakin bagus.<br><span class="ar">↓</span><br>Cost turun.<br><span class="ar">↓</span><br>Harga lebih kompetitif.<br><span class="ar">↓</span><br>Market share naik.<br><span class="ar">↓</span><br>Volume naik.<br><span class="ar">↓</span><br>Manufacturing learning meningkat.<br><span class="ar">↓</span><br>Cost semakin turun.</div>'},
        {id:'s29-3',title:'29.3 Positive Feedback Loop',html:'<p>Ini disebut:</p><p><strong>reinforcing loop.</strong></p><p>Semakin kuat sistem, semakin mudah sistem memperkuat dirinya sendiri.</p>'},
        {id:'s29-4',title:'29.4 Tetapi Ada Risiko',html:'<p>Flywheel dapat berbalik menjadi negative loop:</p><div class="fl">Demand turun<br><span class="ar">↓</span><br>Factory utilization turun<br><span class="ar">↓</span><br>Unit cost naik<br><span class="ar">↓</span><br>Margin turun<br><span class="ar">↓</span><br>Cash flow turun<br><span class="ar">↓</span><br>R&amp;D turun<br><span class="ar">↓</span><br>Technology tertinggal<br><span class="ar">↓</span><br>Demand semakin turun.</div><p>Jadi allocator harus mengawasi:</p><div class="tk"><div class="lb">Takeaway</div><p>direction of the flywheel.</p></div>'}
      ]},
      {id:'bab-30',num:30,title:'STRATEGIC POSITION',secs:[
        {id:'s30-1',title:'30.1 Produk tidak sama dengan Position',html:'<p>Dua perusahaan dapat menjual produk yang sama tetapi mempunyai posisi berbeda.</p><h2>Contoh smartphone:</h2><p><strong>Company A</strong> - Memiliki brand.</p><p><strong>Company B</strong> - Memiliki chip.</p><p><strong>Company C</strong> - Memiliki OS.</p><p><strong>Company D</strong> - Memiliki factory.</p><p><strong>Company E</strong> - Memiliki distribution.</p><p><strong>Company F</strong> - Memiliki ecosystem.</p><p>Pertanyaan:</p><blockquote><p>Siapa yang memiliki posisi paling sulit digantikan?</p></blockquote>'},
        {id:'s30-2',title:'30.2 Value Chain Position',html:'<p>Petakan:</p><div class="fl">Raw Material<br><span class="ar">↓</span><br>Components<br><span class="ar">↓</span><br>Technology<br><span class="ar">↓</span><br>Manufacturing<br><span class="ar">↓</span><br>Distribution<br><span class="ar">↓</span><br>Customer</div><p>Kemudian cari:</p><p>bagian mana yang paling penting?</p>'},
        {id:'s30-3',title:'30.3 Strategic Positioning',html:'<p>Sebuah perusahaan memiliki strategic position kuat jika:</p><ul><li>customer sulit mengganti;</li><li>supplier membutuhkan perusahaan;</li><li>technology sulit ditiru;</li><li>distribution sulit dibangun;</li><li>cost lebih rendah;</li><li>ecosystem saling memperkuat.</li></ul>'},
        {id:'s30-4',title:'30.4 Position Over Profit',html:'<p>Dalam beberapa situasi, perusahaan mungkin menerima profit rendah sementara untuk memperoleh:</p><p>strategic position.</p><p>Tetapi ini berbahaya jika digunakan sebagai alasan untuk terus merugi tanpa jalan menuju economics yang sehat.</p><p>Karena itu harus ada:</p><ul><li>target;</li><li>timeline;</li><li>milestones;</li><li>capital limit;</li><li>exit criteria.</li></ul>'}
      ]},
      {id:'studi-kasus-3',num:null,title:'STUDI KASUS BESAR',isCase:true,secs:[
        {id:'cs3-1',title:'MEMBANGUN PERUSAHAAN INDUSTRI TEKNOLOGI',html:'<p>Kamu mempunyai:</p><p><strong>Rp100 M.</strong></p><p>Kamu ingin membangun perusahaan AI infrastructure.</p><div class="st"><div class="sn">STEP 1 - INDUSTRY</div><div>Pelajari: AI demand; data center; semiconductor; electricity; cooling; networking; software.</div></div><div class="st"><div class="sn">STEP 2 - VALUE CHAIN</div><div>Energy<br><span class="ar">↓</span><br>Data Center<br><span class="ar">↓</span><br>Cooling<br><span class="ar">↓</span><br>Server<br><span class="ar">↓</span><br>Chip<br><span class="ar">↓</span><br>Networking<br><span class="ar">↓</span><br>Cloud/Compute<br><span class="ar">↓</span><br>AI Company<br><span class="ar">↓</span><br>Customer</div></div><div class="st"><div class="sn">STEP 3 - BOTTLENECK</div><div>Misalnya ditemukan: electricity + cooling. Maka jangan otomatis membeli lebih banyak server. Capital mungkin lebih produktif jika digunakan untuk: energy infrastructure; cooling technology; high-efficiency data center.</div></div><div class="st"><div class="sn">STEP 4 - MOAT</div><div>Bangun: energy efficiency; proprietary cooling; location advantage; reliable infrastructure; customer contracts.</div></div><div class="st"><div class="sn">STEP 5 - SCALE</div><div>Setelah economics terbukti: Data center 1, Data center 2, Data center 3, Network effect / purchasing power / operating expertise.</div></div><div class="st"><div class="sn">STEP 6 - CAPITAL REALLOCATION</div><div>Jika facility A: ROIC = 8%. Facility B: ROIC = 25%. Capital baru lebih banyak diarahkan ke B.</div></div><div class="st"><div class="sn">STEP 7 - ECOSYSTEM</div><div>Tambahkan: energy partner; chip supplier; software partner; enterprise customer; financing partner. Maka perusahaan tidak lagi hanya menjadi "data center." Tetapi menjadi: AI infrastructure ecosystem.</div></div>'}
      ]},
      {id:'latihan-3',num:null,title:'LATIHAN BUKU III',isExercise:true,secs:[
        {id:'ex3-1',title:'Latihan 1 - Portfolio',html:'<div class="xz"><div class="lb">Latihan</div><p>Kamu mempunyai:</p><p>Rp100 M.</p><p>Bisnis:</p><ul><li>A = ROIC 5%.</li><li>B = ROIC 30%.</li><li>C = ROIC 20%.</li><li>D = ROIC -10%.</li></ul><p>Buat alokasi.</p><p>Jelaskan mengapa.</p></div>'},
        {id:'ex3-2',title:'Latihan 2 - Industry Analysis',html:'<div class="xz"><div class="lb">Latihan</div><p>Pilih: EV.</p><p>Buat:</p><div class="fl">Raw Material<br><span class="ar">↓</span><br>Battery<br><span class="ar">↓</span><br>Motor<br><span class="ar">↓</span><br>Software<br><span class="ar">↓</span><br>Vehicle<br><span class="ar">↓</span><br>Distribution<br><span class="ar">↓</span><br>Customer</div><p>Kemudian tentukan:</p><ul><li>bottleneck;</li><li>highest-margin area;</li><li>capital-intensive area;</li><li>strategic area;</li><li>potential moat.</li></ul></div>'},
        {id:'ex3-3',title:'Latihan 3 - Leverage',html:'<div class="xz"><div class="lb">Latihan</div><p>Kamu memiliki Rp10 M.</p><p>Pilihan:</p><p><strong>A</strong> - Investasi tanpa debt.</p><p><strong>B</strong> - Rp10 M equity + Rp10 M debt.</p><p>Analisis:</p><ul><li>upside;</li><li>downside;</li><li>cash flow;</li><li>debt service;</li><li>risk.</li></ul><p>Jangan hanya melihat return.</p></div>'},
        {id:'ex3-4',title:'Latihan 4 - Asset Strategy',html:'<div class="xz"><div class="lb">Latihan</div><p>Pabrik membutuhkan: Rp100 M.</p><p>Alternatif:</p><p><strong>Build</strong> - Rp100 M.</p><p><strong>Outsource</strong> - Rp20 M working capital.</p><p>Bandingkan:</p><ul><li>control;</li><li>ROIC;</li><li>cost;</li><li>flexibility;</li><li>supplier dependency;</li><li>strategic value.</li></ul></div>'}
      ],
      quiz:[
        {q:'Jika Bisnis A memiliki ROIC 5% dan Bisnis B memiliki ROIC 30%, alokasi capital terbaik adalah:',o:['Bagi rata 50-50','Berikan lebih banyak ke B','Berikan semua ke A','Tutup kedua bisnis'],c:1},
        {q:'Apa yang dimaksud dengan "internal capital market" dalam sebuah grup?',o:['Pasar saham internal','Pergerakan capital antar-bisnis dalam grup','Pinjaman dari bank','Penerbitan obligasi internal'],c:1},
        {q:'Dalam analisis tiga lapis untuk China, urutan yang benar adalah:',o:['Company - Industry - Policy','Policy - Industry - Company','Industry - Company - Policy','Company - Policy - Industry'],c:1},
        {q:'Financial leverage memiliki efek apa terhadap equity?',o:['Mengurangi risiko','Amplification effect - memperbesar return dan kerugian','Tidak ada efek','Hanya memperbesar return'],c:1},
        {q:'Model A: ROIC 20% (capital Rp100M). Model B: ROIC 25% (capital Rp20M). Mana yang lebih capital-efficient?',o:['Model A karena total return lebih besar','Model B karena ROIC lebih tinggi per capital','Sama saja','Tidak bisa dibandingkan'],c:1}
      ]},
      {id:'ringkasan-3',num:null,title:'RINGKASAN BUKU III',isSummary:true,secs:[
        {id:'sum3-1',title:'Cara Berpikir Capital Allocator',html:'<div class="fl">Satu bisnis<br><span class="ar">↓</span><br>Portfolio bisnis<br><span class="ar">↓</span><br>Internal capital market<br><span class="ar">↓</span><br>Industry<br><span class="ar">↓</span><br>Supply chain<br><span class="ar">↓</span><br>Technology<br><span class="ar">↓</span><br>Government / policy<br><span class="ar">↓</span><br>Strategic position<br><span class="ar">↓</span><br>Industrial ecosystem<br><span class="ar">↓</span><br>Long-term compounding</div>'},
        {id:'sum3-2',title:'Formula Berpikir Capital Allocator',html:'<p>Setiap kali melihat sebuah bisnis, jangan langsung bertanya:</p><blockquote><p>Berapa profitnya?</p></blockquote><p>Gunakan urutan:</p><p><strong>1. MARKET</strong> - Seberapa besar?</p><p><strong>2. VALUE CHAIN</strong> - Bagaimana value dibuat?</p><p><strong>3. BOTTLENECK</strong> - Apa constraint?</p><p><strong>4. CAPITAL</strong> - Berapa yang dibutuhkan?</p><p><strong>5. ECONOMICS</strong> - Berapa margin dan ROIC?</p><p><strong>6. SCALE</strong> - Apa yang terjadi ketika volume meningkat?</p><p><strong>7. MOAT</strong> - Apa yang membuat perusahaan sulit dikalahkan?</p><p><strong>8. POSITION</strong> - Di mana perusahaan berada dalam ecosystem?</p><p><strong>9. DURATION</strong> - Berapa lama advantage bertahan?</p><p><strong>10. REALLOCATION</strong> - Apakah ada penggunaan capital yang lebih baik?</p>'},
        {id:'sum3-3',title:'Buku IV - Berikutnya',html:'<p>Tahap berikutnya adalah bagian yang lebih tinggi:</p><ul><li>BAB 31 - VALUE CHAIN ANALYSIS</li><li>BAB 32 - TIME HORIZON</li><li>BAB 33 - REINVESTMENT RATE</li><li>BAB 34 - DURATION</li><li>BAB 35 - COMPOUNDING</li><li>BAB 36 - CAPITAL ALLOCATION SCORECARD</li><li>BAB 37 - CHINA CAPITAL ALLOCATION MODEL</li><li>BAB 38 - FULL CASE STUDY</li><li>BAB 39 - THE CHINA + GLOBAL CAPITAL ALLOCATOR MODEL</li></ul><p>Di Buku IV, semua konsep akan digabung menjadi satu sistem analisis dari nol sampai membuat keputusan investasi bisnis, termasuk bagaimana menghitung dan membandingkan ROIC, WACC, NPV, IRR, growth, reinvestment rate, capital intensity, moat, duration, risk, opportunity cost, dan strategic value.</p>'}
      ]}
    ]
  }
];

var SLUG = 'china-capital-allocation';
var TITLE = 'CHINA CAPITAL ALLOCATION MASTERCLASS';
var SUB = 'Menguasai seni alokasi modal dari perspektif industri China';

/* ===== FLAT LIST CHAPTERS ===== */
var ALL_CH = [];
for(var bi=0;bi<BOOKS.length;bi++){
  for(var ci=0;ci<BOOKS[bi].chapters.length;ci++){
    var ch=BOOKS[bi].chapters[ci];
    ALL_CH.push({id:ch.id,num:ch.num,title:ch.title,bookId:BOOKS[bi].id,bookNum:BOOKS[bi].n,bookTitle:BOOKS[bi].title,secs:ch.secs,quiz:ch.quiz,isCase:ch.isCase,isExercise:ch.isExercise,isSummary:ch.isSummary});
  }
}

/* ===== STATE ===== */
var ST = {path:'/',done:{},bmk:{},dark:false,qa:{}};
try{ST.done=JSON.parse(localStorage.getItem('cc3d')||'{}');}catch(e){}
try{ST.bmk=JSON.parse(localStorage.getItem('cc3b')||'{}');}catch(e){}
try{ST.dark=localStorage.getItem('cc3k')==='1';}catch(e){}
try{ST.qa=JSON.parse(localStorage.getItem('cc3q')||'{}');}catch(e){}
function save(){try{localStorage.setItem('cc3d',JSON.stringify(ST.done));localStorage.setItem('cc3b',JSON.stringify(ST.bmk));localStorage.setItem('cc3k',ST.dark?'1':'0');localStorage.setItem('cc3q',JSON.stringify(ST.qa));}catch(e){}}

function getCh(id){for(var i=0;i<ALL_CH.length;i++)if(ALL_CH[i].id===id)return ALL_CH[i];return null;}
function prevCh(id){for(var i=0;i<ALL_CH.length;i++)if(ALL_CH[i].id===id)return i>0?ALL_CH[i-1]:null;return null;}
function nextCh(id){for(var i=0;i<ALL_CH.length;i++)if(ALL_CH[i].id===id)return i<ALL_CH.length-1?ALL_CH[i+1]:null;return null;}
function doneCount(){var c=0;for(var k in ST.done)if(ST.done[k])c++;return c;}
function pct(){return ALL_CH.length>0?Math.round(doneCount()/ALL_CH.length*100):0;}

function toast(m,tp){var t=document.getElementById('TST');t.textContent=m;t.className='tst '+tp+' sh';setTimeout(function(){t.classList.remove('sh');},2200);}

/* ===== NAVIGATE ===== */
function go(p){
  ST.path=p;
  if(p==='/') window.location.hash='';
  else window.location.hash=p;
  doRender();
  window.scrollTo(0,0);
}

/* ===== RENDER ===== */
function doRender(){
  var app=document.getElementById('APP');
  if(!app) return;
  var p=ST.path;
  var pts=p.replace(/^\//,'').split('/').filter(Boolean);

  // Tentukan halaman apa
  var isChapter=false,chapterObj=null;
  var isBook=false,bookObj=null;
  var isCourse=(p==='/course/'+SLUG);

  if(pts.length>=3 && pts[0]==='course' && pts[1]===SLUG){
    chapterObj=getCh(pts[2]);
    if(chapterObj) isChapter=true;
    else{
      for(var i=0;i<BOOKS.length;i++){if(BOOKS[i].id===pts[2]){bookObj=BOOKS[i];isBook=true;break;}}
    }
  }

  var sb=document.getElementById('SB');
  var tp=document.getElementById('TPC');
  var fnv=document.getElementById('FNAV');

  if(isChapter){
    sb.style.display='';tp.style.display='';fnv.style.display='';
    app.style.marginLeft='';app.style.marginRight='';
    app.innerHTML=renderChapter(chapterObj);
    renderTOC(chapterObj);
    renderFooterNav(chapterObj);
  } else {
    sb.style.display='none';tp.style.display='none';fnv.style.display='none';
    app.style.marginLeft='0';app.style.marginRight='0';
    if(isBook) app.innerHTML=renderBook(bookObj);
    else if(isCourse) app.innerHTML=renderCourse();
    else app.innerHTML=renderHome();
  }
  renderSidebar();
  renderProgress();
  renderBreadcrumb();
}

/* ===== CHAPTER ===== */
function renderChapter(ch){
  var bm=ST.bmk[ch.id], dn=ST.done[ch.id];
  var label=ch.isCase?'Studi Kasus':ch.isExercise?'Latihan':ch.isSummary?'Ringkasan':'';
  var h='<div class="fi" style="padding-bottom:80px"><div style="max-width:680px;margin:0 auto;padding:24px 16px">';
  h+='<div style="display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--ts);margin-bottom:16px"><span>Buku '+ch.bookNum+'</span><i class="fas fa-chevron-right" style="font-size:.45rem"></i><span>'+ch.bookTitle+'</span></div>';
  h+='<div style="display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:24px"><div>';
  if(ch.num) h+='<div style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ac);margin-bottom:4px">BAB '+ch.num+'</div>';
  else if(label) h+='<div style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ac);margin-bottom:4px">'+label+'</div>';
  h+='<h1 class="fr" style="font-size:1.7rem;font-weight:800;line-height:1.25;margin:0">'+ch.title+'</h1></div>';
  h+='<button class="bmk '+(bm?'on':'')+'" style="background:none;border:none;font-size:1.2rem;cursor:pointer;padding:6px;color:'+(bm?'#d97706':'var(--ts)')+'" data-id="'+ch.id+'"><i class="fas fa-bookmark"></i></button>';
  h+='</div><div class="ct">';
  for(var i=0;i<ch.secs.length;i++){
    var sec=ch.secs[i];
    h+='<section id="'+sec.id+'" style="margin-bottom:28px"><h2>'+sec.title+'</h2>'+sec.html+'</section>';
  }
  // Quiz
  if(ch.quiz&&ch.quiz.length>0){
    h+='<div style="margin-top:36px;padding-top:24px;border-top:2px solid var(--bd)"><h2 class="fr" style="font-size:1.5rem;font-weight:700;margin:0 0 20px">Quiz</h2><div style="display:grid;gap:16px">';
    for(var qi=0;qi<ch.quiz.length;qi++){
      var q=ch.quiz[qi];
      var sv=ST.qa[ch.id+'_'+qi];
      h+='<div style="border:1px solid var(--bd);border-radius:10px;padding:16px 18px;background:var(--card)">';
      h+='<div style="font-weight:600;margin-bottom:12px"><span style="font-size:.78rem;font-weight:700;margin-right:6px;color:var(--ac)">Soal '+(qi+1)+'</span>'+q.q+'</div>';
      h+='<div style="display:grid;gap:6px">';
      for(var oi=0;oi<q.o.length;oi++){
        var cls='qo';
        if(sv!==undefined){cls+=' disabled';if(oi===q.c)cls+=' ok';else if(oi===sv&&oi!==q.c)cls+=' no';}
        h+='<button class="'+cls+'" '+(sv!==undefined?'disabled':'')+' data-ch="'+ch.id+'" data-qi="'+qi+'" data-oi="'+oi+'" data-ci="'+q.c+'">'+q.o[oi]+'</button>';
      }
      h+='</div></div>';
    }
    h+='</div></div>';
  }
  h+='</div></div></div>';
  return h;
}

/* ===== BREADCRUMB ===== */
function renderBreadcrumb(){
  var el=document.getElementById('BC');if(!el)return;
  var p=ST.path;
  if(p==='/'){el.innerHTML='<span style="font-weight:600;color:var(--tp)">Beranda</span>';return;}
  if(p==='/course/'+SLUG){el.innerHTML='<span data-goto="/" style="color:var(--ts);cursor:pointer">Beranda</span><i class="fas fa-chevron-right" style="font-size:.4rem"></i><span style="font-weight:600;color:var(--tp)">Course</span>';return;}
  var pts=p.replace(/^\//,'').split('/').filter(Boolean);
  if(pts.length===3){
    var bk=null;for(var i=0;i<BOOKS.length;i++)if(BOOKS[i].id===pts[2]){bk=BOOKS[i];break;}
    el.innerHTML='<span data-goto="/" style="color:var(--ts);cursor:pointer">Beranda</span><i class="fas fa-chevron-right" style="font-size:.4rem"></i><span data-goto="/course/'+SLUG+'" style="color:var(--ts);cursor:pointer">Course</span><i class="fas fa-chevron-right" style="font-size:.4rem"></i><span style="font-weight:600;color:var(--tp)">'+(bk?bk.title:'')+'</span>';
    return;
  }
  if(pts.length===4){
    var ch=getCh(pts[3]);
    el.innerHTML='<span data-goto="/" style="color:var(--ts);cursor:pointer">Beranda</span><i class="fas fa-chevron-right" style="font-size:.4rem"></i><span data-goto="/course/'+SLUG+'" style="color:var(--ts);cursor:pointer">Course</span><i class="fas fa-chevron-right" style="font-size:.4rem"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;display:inline-block;vertical-align:bottom">'+(ch?ch.title:'')+'</span>';
  }
}

/* ===== FOOTER NAV ===== */
function renderFooterNav(ch){
  var pv=prevCh(ch.id), nx=nextCh(ch.id), dn=ST.done[ch.id];
  var bP=document.getElementById('FPRV'), bD=document.getElementById('FDN'), bN=document.getElementById('FNXT');
  if(pv){bP.style.display='flex';bP.setAttribute('data-goto','/course/'+SLUG+'/'+pv.id);var sp=bP.querySelector('span');if(sp)sp.textContent=pv.num?'Bab '+pv.num:pv.title;}
  else bP.style.display='none';
  bD.setAttribute('data-toggle-done',ch.id);
  bD.style.background=dn?'var(--bg3)':'var(--ac)';
  bD.style.color=dn?'':'#fff';
  bD.querySelector('i').className='fas '+(dn?'fa-check-circle':'fa-circle');
  var sd=bD.querySelector('span');if(sd)sd.textContent=dn?'Selesai':'Tandai Selesai';
  if(nx){bN.style.display='flex';bN.setAttribute('data-goto','/course/'+SLUG+'/'+nx.id);var sn=bN.querySelector('span');if(sn)sn.textContent=nx.num?'Bab '+nx.num:nx.title;}
  else bN.style.display='none';
}

/* ===== EVENT DELEGATION — ini yang memastikan semua tombol jalan ===== */
document.addEventListener('click', function(e){
  var el=e.target;

  // Tombol sidebar items
  var goto=el.getAttribute('data-goto');
  if(!goto){var p=el.closest('[data-goto]');if(p)goto=p.getAttribute('data-goto');}
  if(goto){go(goto);return;}

  // Tombol toggle done
  var toggleDone=el.getAttribute('data-toggle-done');
  if(!toggleDone){var p=el.closest('[data-toggle-done]');if(p)toggleDone=p.getAttribute('data-toggle-done');}
  if(toggleDone){ST.done[toggleDone]=!ST.done[toggleDone];save();doRender();toast(ST.done[toggleDone]?'Bab ditandai selesai!':'Tanda selesai dibatalkan.');return;}

  // Bookmark
  var bmkId=el.getAttribute('data-id');
  if(!bmkId){var p=el.closest('[data-id]');if(p&&p.classList.contains('bmk'))bmkId=p.getAttribute('data-id');}
  if(bmkId){ST.bmk[bmkId]=!ST.bmk[bmkId];save();doRender();toast(ST.bmk[bmkId]?'Ditambahkan ke bookmark.':'Bookmark dihapus.','inf');return;}

  // Quiz
  var qCh=el.getAttribute('data-ch');
  if(qCh){
    var qi=parseInt(el.getAttribute('data-qi'));
    var oi=parseInt(el.getAttribute('data-oi'));
    var ci=parseInt(el.getAttribute('data-ci'));
    ST.qa[qCh+'_'+qi]=oi;save();doRender();
    toast(oi===ci?'Jawaban benar!':'Jawaban salah.','ok');
    return;
  }

  // TOC scroll
  var scrollId=el.getAttribute('data-scroll');
  if(!scrollId){var p=el.closest('[data-scroll]');if(p)scrollId=p.getAttribute('data-scroll');}
  if(scrollId){
    if(scrollId==='quiz-section'){var qs=document.querySelector('.ct > div:last-child');if(qs)qs.scrollIntoView({behavior:'smooth'});}
    else{var target=document.getElementById(scrollId);if(target)target.scrollIntoView({behavior:'smooth'});}
    return;
  }
});

/* ===== SEARCH ===== */
var sIdx=[];
for(var bi=0;bi<BOOKS.length;bi++){
  var bk=BOOKS[bi];
  for(var ci=0;ci<bk.chapters.length;ci++){
    var ch=bk.chapters[ci];
    for(var si=0;si<ch.secs.length;si++){
      var sec=ch.secs[si];
      var tmp=document.createElement('div');tmp.innerHTML=sec.html;
      var text=tmp.textContent||tmp.innerText||'';
      if(text.length>5) sIdx.push({ci:ch.id,ct:ch.title,st:sec.title,tx:text,bn:bk.n});
    }
    if(ch.quiz)for(var qi=0;qi<ch.quiz.length;qi++) sIdx.push({ci:ch.id,ct:ch.title,st:'Quiz',tx:ch.quiz[qi].q,bn:bk.n});
  }
}

function openSR(){document.getElementById('SMO').classList.add('on');setTimeout(function(){document.getElementById('SIN').focus();},120);}
function closeSR(){document.getElementById('SMO').classList.remove('on');document.getElementById('SIN').value='';document.getElementById('SRS').innerHTML='';}

document.getElementById('SIN').addEventListener('input',function(){
  var q=this.value;var el=document.getElementById('SRS');
  if(q.length<2){el.innerHTML='';return;}
  var ql=q.toLowerCase();var m=[];
  for(var i=0;i<sIdx.length&&m.length<15;i++){if(sIdx[i].tx.toLowerCase().indexOf(ql)!==-1)m.push(sIdx[i]);}
  if(!m.length){el.innerHTML='<div style="padding:16px;text-align:center;font-size:.85rem;color:var(--ts)">Tidak ditemukan.</div>';return;}
  var seen={};var uniq=[];
  for(var i=0;i<m.length;i++){var k=m[i].ci+m[i].st;if(!seen[k]){seen[k]=1;uniq.push(m[i]);}}
  var h='';
  for(var i=0;i<uniq.length;i++){
    var it=uniq[i];var idx=it.tx.toLowerCase().indexOf(ql);
    var s=Math.max(0,idx-35),e=Math.min(it.tx.length,idx+ql.length+35);
    var ctx=(s>0?'...':'')+it.tx.substring(s,e)+(e<it.tx.length?'...':'');
    ctx=ctx.replace(new RegExp('('+ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<strong style="color:var(--ac)">$1</strong>');
    h+='<div class="sri" data-goto="/course/'+SLUG+'/'+it.ci+'"><div class="st">Buku '+it.bn+' - '+it.ct+'</div><div class="sc">'+it.st+' - '+ctx+'</div></div>';
  }
  el.innerHTML=h;
});

/* ===== KEYBOARD ===== */
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openSR();}
  if(e.key==='Escape')closeSR();
});

/* ===== HEADER BUTTONS ===== */
document.getElementById('menuBtn').addEventListener('click',function(){
  ST.sbOpen=!ST.sbOpen;
  document.getElementById('SB').classList.toggle('on',ST.sbOpen);
  document.getElementById('OV').classList.toggle('on',ST.sbOpen);
});
document.getElementById('OV').addEventListener('click',function(){
  ST.sbOpen=false;
  document.getElementById('SB').classList.remove('on');
  document.getElementById('OV').classList.remove('on');
});
document.getElementById('searchBtn').addEventListener('click',openSR);
document.getElementById('SMO').addEventListener('click',function(e){if(e.target===this)closeSR();});
document.getElementById('themeBtn').addEventListener('click',function(){
  ST.dark=!ST.dark;
  document.documentElement.classList.toggle('dark',ST.dark);
  this.innerHTML=ST.dark?'<i class="fas fa-sun"></i>':'<i class="fas fa-moon"></i>';
  save();
});
document.getElementById('logoBtn').addEventListener('click',function(e){e.preventDefault();go('/');});

/* ===== HASH CHANGE ===== */
window.addEventListener('hashchange',function(){ST.path=window.location.hash.slice(1)||'/';doRender();});
window.addEventListener('resize',function(){if(window.innerWidth>1024){ST.sbOpen=false;document.getElementById('SB').classList.remove('on');document.getElementById('OV').classList.remove('on');}});

/* ===== INIT ===== */
ST.dark = ST.dark;
document.documentElement.classList.toggle('dark', ST.dark);
document.getElementById('themeBtn').innerHTML = ST.dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
ST.path = window.location.hash.slice(1) || '/';
doRender();
</script>
</body>
